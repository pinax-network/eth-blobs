specVersion: v0.1.0
package:
  name: "eth_blobs"
  version: v0.8.0
  image: ./logo.png
  url: https://github.com/pinax-network/eth-blobs
  description: |
    This substreams package lets you stream Consensus Layer EIP-4844 blobs with attached meta data.

    Among the supported chains are:
    - mainnet-cl: eth-cl.substreams.pinax.network:443
    - goerli-cl: goerli-cl.substreams.pinax.network:443
    - sepolia-cl: sepolia-cl.substreams.pinax.network:443
    - holesky-cl: holesky-cl.substreams.pinax.network:443
    - gnosis-cl: gnosis-cl.substreams.pinax.network:443
    - chiado-cl: chiado-cl.substreams.pinax.network:443

imports:
  beacon: https://github.com/pinax-network/firehose-beacon/releases/download/v0.7.1/beacon-v0.7.0.spkg
  entity: https://github.com/streamingfast/substreams-sink-entity-changes/releases/download/v2.0.0/substreams-entity-change-v2.0.0.spkg

protobuf:
  files:
    - pinax/ethereum/blobs/v1/blobs.proto
    - substreams/sink/kv/v1/kv.proto
    - substreams/sink/kv/v1/services.proto
  importPaths:
    - ../proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/eth_blobs.wasm

modules:
  - name: map_blobs
    kind: map
    inputs:
      - source: sf.beacon.type.v1.Block
    output:
      type: proto:pinax.ethereum.blobs.v1.Slot

  - name: kv_out
    kind: map
    inputs:
      - map: map_blobs
    output:
      type: proto:sf.substreams.sink.kv.v1.KVOperations

  - name: graph_out
    kind: map
    inputs:
      - map: map_blobs
    output:
      type: proto:sf.substreams.sink.entity.v1.EntityChanges

sink:
  module: kv_out
  type: sf.substreams.sink.kv.v1.GenericService
  config:

network: beacon
