# Workflow to check code and input formats and do linting using golangci-lint
name: Linting
on:
  push:
    branches: [ develop* ]
  pull_request:
    branches: [ develop*, main ]

permissions:
  contents: read
  pull-requests: read
jobs:
  golangci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [ 1.25.x ]
        os: [ ubuntu-latest ]
    name: lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format
        run: cd api-service && task test:format

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Required: the version of golangci-lint is required and must be specified without patch version: we always use the latest patch version.
          version: v2.11.4
          # Optional: working directory, useful when you have multiple Go modules
          working-directory: api-service
          # Optional: golangci-lint command line arguments.
          args: --timeout=5m
          # Optional: show only new issues if it's a pull request. The default value is `false`.
          only-new-issues: true
