application:
  gin_mode: "release"           # The Gin framework application level must be one of "debug" or "release"
  http_host: "0.0.0.0:8080"     # The HTTP host this application is listening on
  domain: "localhost:8080"      # The domain used for the Swagger documentation

chain:
  name: "Ethereum"              # The chain name for Swagger documentation
  # finality_lag: 64            # Optional. Slots behind head before a slot is reported finalized. Defaults to 64 (Ethereum mainnet, 2 epochs). Gnosis: 32. Higher = more conservative.

store:                          # The bucket the sink writes. Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
  endpoint: "http://localhost:9000"  # S3 endpoint URL; empty for AWS proper
  bucket: "blobs-eth"
  # prefix: "eth"               # Key prefix when several chains share a bucket
  # region: "us-east-1"         # Signing region; the default suits Ceph RGW and MinIO
  path_style: true              # Required by Ceph RGW and MinIO
  # timeout: 30s                # Per-request timeout
  # head_ttl: 2s                # How long a fetched head is reused before asking the store again
