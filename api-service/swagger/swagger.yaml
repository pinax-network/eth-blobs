host: localhost:8080
info:
  contact: {}
  description: Use this API to get EIP-4844 blobs as a drop-in replacement for Consensus
    Layer clients API.
  title: Ethereum Blobs REST API
  version: "1.0"
paths:
  /eth/v1/beacon/blob_sidecars/{block_id}:
    get:
      parameters:
      - description: 'Block identifier. Can be one of: ''head'', slot number, hex
          encoded blockRoot with 0x prefix'
        in: path
        name: block_id
        required: true
        type: string
      - collectionFormat: csv
        description: Blob sidecar indices to return. Accepts repeated keys (?indices=0&indices=1)
          or comma-separated (?indices=0,1). Returns all if omitted.
        in: query
        items:
          type: string
        name: indices
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successful response
          schema:
            $ref: '#/definitions/dto.BlobSidecarsResponse'
        "400":
          description: "invalid_slot\"\t\"Invalid block id"
          schema:
            $ref: '#/definitions/response.ApiErrorResponse'
        "404":
          description: "slot_not_found\"\t\"Slot not found"
          schema:
            $ref: '#/definitions/response.ApiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiErrorResponse'
      summary: Get Blobs by block id
      tags:
      - blobs
  /eth/v1/beacon/blobs/{block_id}:
    get:
      parameters:
      - description: 'Block identifier. Can be one of: ''head'', slot number, or 0x-prefixed
          hex block root'
        in: path
        name: block_id
        required: true
        type: string
      - collectionFormat: csv
        description: 0x-prefixed 32-byte versioned hashes to filter by. Accepts repeated
          keys (?versioned_hashes=0x01..&versioned_hashes=0x01..) or comma-separated.
          Returns all blobs if omitted.
        in: query
        items:
          type: string
        name: versioned_hashes
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successful response
          schema:
            $ref: '#/definitions/dto.BlobsResponse'
        "400":
          description: invalid_slot or invalid_versioned_hash
          schema:
            $ref: '#/definitions/response.ApiErrorResponse'
        "404":
          description: slot_not_found
          schema:
            $ref: '#/definitions/response.ApiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiErrorResponse'
      summary: Get Blobs by block id (Beacon API v4.0.0)
      tags:
      - blobs
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.HealthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiErrorResponse'
      summary: Returns health status of this API.
      tags:
      - health
  /version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiDataResponse'
            - properties:
                data:
                  $ref: '#/definitions/controllers.VersionResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ApiErrorResponse'
      summary: Returns the version, commit hash and enabled features of this API.
      tags:
      - version
schemes:
- https
- http
swagger: "2.0"
