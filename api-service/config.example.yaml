application:
  gin_mode: "debug"             # The Gin framework application level must be one of "debug" or "release"
  http_host: "0.0.0.0:8080"     # The HTTP host this application is listening on, leave empty to not start an HTTP server
  grpc_host: "0.0.0.0:9000"     # The gRPC host this application is listening on, leave empty to not start a gRPC server
  domain: "localhost:8080"      # The domain used for the Swagger documentation

chain:
  name: "Ethereum"              # The name of the chain
  finality_lag: 64              # Slots behind head before a slot is reported finalized. >=2 epochs (Ethereum/Sepolia/Hoodi: 64, Gnosis: 32). Pick higher for extra safety.

sink:
  address: "localhost:8000"     # The gRPC host of the sink server
